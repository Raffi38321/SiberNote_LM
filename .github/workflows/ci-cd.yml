name: CI/CD Pipeline for SiberNote LM

on:
  push:
    branches:
      - main
    paths-ignore:
      - "README.md"
      - "cd.md"
      - "docs/**"
      - ".github/workflows/**"
  pull_request:
    branches:
      - main
    paths-ignore:
      - "README.md"
      - "cd.md"
      - "docs/**"

env:
  REGISTRY: ghcr.io
  BACKEND_IMAGE: sibernote-backend
  FRONTEND_IMAGE: sibernote-frontend

jobs:
  # ──────────────────────────────────────────────────────────────────────────
  # CI: Build & Test
  # ──────────────────────────────────────────────────────────────────────────
  ci:
    name: Continuous Integration
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── Backend CI ──────────────────────────────────────────────────────────
      - name: Setup Node.js (Backend)
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: "backend/package-lock.json"

      - name: Install backend dependencies
        working-directory: ./backend
        run: npm ci

      - name: Setup CI environment
        working-directory: ./backend
        run: cp .env.ci .env

      - name: Build backend
        working-directory: ./backend
        run: npm run build
        env:
          NODE_ENV: production

      # Note: Backend test script is a stub. No automated tests yet.
      # When tests are available, uncomment:
      # - name: Run backend tests
      #   working-directory: ./backend
      #   run: npm run test

      # ── Frontend CI ─────────────────────────────────────────────────────────
      - name: Setup Node.js (Frontend)
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: "Frontend/package-lock.json"

      - name: Install frontend dependencies
        working-directory: ./Frontend
        run: npm ci

      - name: Build frontend
        working-directory: ./Frontend
        run: npm run build

      # ── Docker Compose Validation ───────────────────────────────────────────
      - name: Validate docker-compose.yml
        run: docker compose -f docker-compose.yml config --quiet

      - name: Validate docker-compose.prod.yml
        run: docker compose -f docker-compose.prod.yml config --quiet
      # ── Docker BuildKit Setup ───────────────────────────────────────────────
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

  # ──────────────────────────────────────────────────────────────────────────
  # Build & Push: Docker images to GHCR
  # ──────────────────────────────────────────────────────────────────────────
  build:
    name: Build & Push Docker Images
    runs-on: ubuntu-latest
    needs: ci
    # Hanya jalankan di branch main (push), skip di pull request
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # ── Backend Image ───────────────────────────────────────────────────────
      - name: Extract backend metadata
        id: backend-meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ env.BACKEND_IMAGE }}
          tags: |
            type=sha,prefix={{branch}}-
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push backend image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          push: true
          tags: ${{ steps.backend-meta.outputs.tags }}
          labels: ${{ steps.backend-meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # ── Frontend Image ──────────────────────────────────────────────────────
      - name: Extract frontend metadata
        id: frontend-meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ env.FRONTEND_IMAGE }}
          tags: |
            type=sha,prefix={{branch}}-
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push frontend image
        uses: docker/build-push-action@v5
        with:
          context: ./Frontend
          push: true
          tags: ${{ steps.frontend-meta.outputs.tags }}
          labels: ${{ steps.frontend-meta.outputs.labels }}
          build-args: |
            VITE_API_BASE_URL=${{ secrets.VITE_API_BASE_URL || 'https://api.yourdomain.com' }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Output image tags
        run: |
          echo "### Backend Image Tags" >> $GITHUB_STEP_SUMMARY
          echo "${{ steps.backend-meta.outputs.tags }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Frontend Image Tags" >> $GITHUB_STEP_SUMMARY
          echo "${{ steps.frontend-meta.outputs.tags }}" >> $GITHUB_STEP_SUMMARY

  # ──────────────────────────────────────────────────────────────────────────
  # CD: Deploy to VPS
  # ──────────────────────────────────────────────────────────────────────────
  deploy:
    name: Continuous Deployment
    runs-on: ubuntu-latest
    needs: build
    # Hanya jalankan setelah build berhasil
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && success()
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract image tags for deployment
        id: image-tags
        run: |
          # Gunakan commit SHA sebagai image tag untuk immutable deployment
          COMMIT_SHA=${{ github.sha }}
          BACKEND_TAG="${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ env.BACKEND_IMAGE }}:main-${COMMIT_SHA:0:7}"
          FRONTEND_TAG="${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ env.FRONTEND_IMAGE }}:main-${COMMIT_SHA:0:7}"
          echo "backend_tag=${BACKEND_TAG}" >> $GITHUB_OUTPUT
          echo "frontend_tag=${FRONTEND_TAG}" >> $GITHUB_OUTPUT
          echo "commit_sha=${COMMIT_SHA:0:7}" >> $GITHUB_OUTPUT

      - name: Deploy via SSH
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: 22
          script: |
            set -e
            
            # Navigate ke deployment directory
            cd ${{ secrets.VPS_DEPLOY_PATH }}
            
            # Pull latest code (untuk docker-compose.prod.yml dan .env)
            git pull origin main || true
            
            # Setup environment variables untuk deployment
            export GHCR_REGISTRY="${{ env.REGISTRY }}/${{ github.repository_owner }}"
            export IMAGE_TAG="main-${{ steps.image-tags.outputs.commit_sha }}"
            export UPLOADS_DIR="${{ secrets.UPLOADS_DIR || '/var/www/sibernote/uploads' }}"
            
            # Login ke GitHub Container Registry (jika private repo)
            echo "${{ secrets.GHCR_TOKEN || secrets.GITHUB_TOKEN }}" | docker login -u ${{ github.actor }} --password-stdin ${{ env.REGISTRY }}
            
            # Pull latest images
            docker pull ${{ steps.image-tags.outputs.backend_tag }} || true
            docker pull ${{ steps.image-tags.outputs.frontend_tag }} || true
            
            # Backup current deployment (jika ada)
            if [ -f docker-compose.prod.yml ]; then
              docker compose -f docker-compose.prod.yml ps > /tmp/deployment_before.log || true
            fi
            
            # Deploy dengan docker-compose.prod.yml
            docker compose -f docker-compose.prod.yml up -d --no-build
            
            # Wait for services to be healthy
            echo "Waiting for services to stabilize..."
            sleep 10
            
            # Health check
            echo "Running health checks..."
            
            BACKEND_HEALTH=$(docker compose -f docker-compose.prod.yml exec -T backend wget -qO- http://localhost:8080/health || echo "fail")
            if echo "$BACKEND_HEALTH" | grep -q "healthy"; then
              echo "✓ Backend health check passed"
            else
              echo "✗ Backend health check failed"
              echo "Health response: $BACKEND_HEALTH"
              exit 1
            fi
            
            FRONTEND_HEALTH=$(docker compose -f docker-compose.prod.yml exec -T frontend wget -qO- http://localhost:80/ || echo "fail")
            if [ ! -z "$FRONTEND_HEALTH" ]; then
              echo "✓ Frontend health check passed"
            else
              echo "✗ Frontend health check failed"
              exit 1
            fi
            
            echo "Deployment successful!"
            docker compose -f docker-compose.prod.yml ps

      - name: Verify deployment
        run: |
          echo "### Deployment Summary" >> $GITHUB_STEP_SUMMARY
          echo "- Backend Image: ${{ steps.image-tags.outputs.backend_tag }}" >> $GITHUB_STEP_SUMMARY
          echo "- Frontend Image: ${{ steps.image-tags.outputs.frontend_tag }}" >> $GITHUB_STEP_SUMMARY
          echo "- Commit SHA: ${{ steps.image-tags.outputs.commit_sha }}" >> $GITHUB_STEP_SUMMARY
          echo "- VPS Host: ${{ secrets.VPS_HOST }}" >> $GITHUB_STEP_SUMMARY

      - name: Deployment failed notification
        if: failure()
        run: |
          echo "### Deployment Failed ❌" >> $GITHUB_STEP_SUMMARY
          echo "Check VPS logs at ${{ secrets.VPS_HOST }}:${{ secrets.VPS_DEPLOY_PATH }}" >> $GITHUB_STEP_SUMMARY
